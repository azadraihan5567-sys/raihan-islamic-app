class _FeatureCard extends StatelessWidget {
  final IconData icon;
  final String title;
  final String subtitle;
  final VoidCallback onTap;

  const _FeatureCard({
    required this.icon,
    required this.title,
    required this.subtitle,
    required this.onTap,
  });

  @override
  Widget build(BuildContext context) {
    return Card(
      margin: const EdgeInsets.only(bottom: 12),
      child: ListTile(
        contentPadding: const EdgeInsets.symmetric(
          horizontal: 18,
          vertical: 8,
        ),
        leading: CircleAvatar(
          radius: 25,
          child: Icon(icon),
        ),
        title: Text(
          title,
          style: const TextStyle(
            fontWeight: FontWeight.bold,
            fontSize: 17,
          ),
        ),
        subtitle: Text(subtitle),
        trailing: const Icon(Icons.arrow_forward_ios_rounded, size: 18),
        onTap: onTap,
      ),
    );
  }
}

class QuranPage extends StatelessWidget {
  const QuranPage({super.key});

  final List<Map<String, String>> surahs = const [
    {
      'number': '১',
      'name': 'সূরা আল-ফাতিহা',
      'arabic': 'الْحَمْدُ لِلَّهِ رَبِّ الْعَالَمِينَ',
      'meaning': 'সমস্ত প্রশংসা আল্লাহর, যিনি সকল জগতের প্রতিপালক।',
    },
    {
      'number': '১১২',
      'name': 'সূরা আল-ইখলাস',
      'arabic': 'قُلْ هُوَ اللَّهُ أَحَدٌ',
      'meaning': 'বলুন, তিনি আল্লাহ, এক ও অদ্বিতীয়।',
    },
    {
      'number': '১১৩',
      'name': 'সূরা আল-ফালাক',
      'arabic': 'قُلْ أَعُوذُ بِرَبِّ الْفَلَقِ',
      'meaning': 'বলুন, আমি আশ্রয় গ্রহণ করছি ঊষার প্রতিপালকের।',
    },
    {
      'number': '১১৪',
      'name': 'সূরা আন-নাস',
      'arabic': 'قُلْ أَعُوذُ بِرَبِّ النَّاسِ',
      'meaning': 'বলুন, আমি আশ্রয় গ্রহণ করছি মানুষের প্রতিপালকের।',
    },
  ];

  @override
  Widget build(BuildContext context) {
    return Scaffold(
      appBar: AppBar(
        title: const Text(
          'আল-কুরআন',
          style: TextStyle(fontWeight: FontWeight.bold),
        ),
        centerTitle: true,
      ),
      body: ListView.builder(
        padding: const EdgeInsets.all(16),
        itemCount: surahs.length,
        itemBuilder: (context, index) {
          final surah = surahs[index];

          return Card(
            margin: const EdgeInsets.only(bottom: 14),
            child: Padding(
              padding: const EdgeInsets.all(18),
              child: Column(
                crossAxisAlignment: CrossAxisAlignment.end,
                children: [
                  Row(
                    children: [
                      CircleAvatar(
                        child: Text(surah['number']!),
                      ),
                      const SizedBox(width: 12),
                      Expanded(
                        child: Text(
                          surah['name']!,
                          style: const TextStyle(
                            fontSize: 18,
                            fontWeight: FontWeight.bold,
                          ),
                        ),
                      ),
                    ],
                  ),
                  const SizedBox(height: 18),
                  Text(
                    surah['arabic']!,
                    textAlign: TextAlign.right,
                    textDirection: TextDirection.rtl,
                    style: const TextStyle(
                      fontSize: 28,
                      height: 1.8,
                      fontWeight: FontWeight.bold,
                    ),
                  ),
                  const Divider(height: 28),
                  Align(
                    alignment: Alignment.centerLeft,
                    child: Text(
                      surah['meaning']!,
                      textAlign: TextAlign.left,
                      style: const TextStyle(
                        fontSize: 16,
                        height: 1.7,
                      ),
                    ),
                  ),
                ],
              ),
            ),
          );
        },
      ),
    );
  }
}
