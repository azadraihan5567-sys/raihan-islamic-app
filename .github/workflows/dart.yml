}

class RaihanIslamicApp extends StatelessWidget {
  const RaihanIslamicApp({super.key});

  @override
  Widget build(BuildContext context) {
    return MaterialApp(
      debugShowCheckedModeBanner: false,
      title: 'Raihan Islamic App',
      theme: ThemeData(
        useMaterial3: true,
        fontFamily: 'sans',
        colorSchemeSeed: Colors.green,
      ),
      home: const HomePage(),
    );
  }
}

